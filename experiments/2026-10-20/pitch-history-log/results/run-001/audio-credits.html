<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工入力音声の出典</title><style>:root{color-scheme:light dark}body{font:16px/1.8 system-ui;max-width:850px;margin:30px auto;padding:20px}</style><h1>人工入力音声の出典</h1><p>正弦波とPCG64乱数（seed20261020）だけから作成した人工音3本。録音音声・個人情報は含まない。f*=97.65625Hz、Uは2/3/4次、Eは2/4/6次、共通白色雑音と共通gainを適用。16kHz、各16384サンプル＝1.024秒、モノラルPCM16。</p><p>既存WAVをbyte同一で再利用。追加正規化・clip・音声再生成なし。PCM16化はround-to-nearest-even(x*32768)。音質評価・PMLへの採用を意味しない。</p><p><a href="index.html">統合レポート</a></p>
