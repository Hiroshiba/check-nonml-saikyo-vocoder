<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音声の出典と改変</title><style>body{font:16px/1.7 system-ui,sans-serif;margin:0;background:#f2f5f7;color:#16313e}main{max-width:1350px;margin:auto;padding:28px}section{padding:24px;background:#fff;border:1px solid #d5e0e5;border-radius:14px;margin:20px 0}h1{font-size:30px}a{color:#006f83}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border:1px solid #ccd9df;text-align:left}th{background:#edf3f6}small{display:block;color:#536b78;font-size:12px}.scroll{overflow:auto}.rank{display:inline-block;border:1px solid #7e8c92;border-radius:4px;padding:0 5px;font-weight:bold}.r1{background:#ffdc70;color:#342900;border:2px solid #9e7300}.r2{background:#d9e3ea;color:#243746;border:2px solid #647785}.r3{background:#eed0b5;color:#573319;border:2px solid #98613c}.audio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}audio{display:block;width:100%;margin:8px 0}.note{border-left:4px solid #d39335;padding:14px;background:#fff5de}summary{cursor:pointer;font-weight:bold}details{margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}input{font:inherit;padding:8px;width:min(90%,600px)}.pml{font-weight:600}nav a{margin-right:16px}@media(max-width:650px){main{padding:12px}section{padding:16px}.audio-grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#0e1b22;color:#e5eef1}section{background:#162a35;border-color:#38505b}th{background:#203b49}td,th{border-color:#48606b}small{color:#bed0d7}a{color:#74d3e0}.note{background:#3a301d}input{background:#203b49;color:#fff}}</style><main><h1>固定5例の出典・改変</h1><p>LibriSpeech test-clean / OpenSLR 12。Vassil Panayotov（Daniel Povey協力）、LibriVox由来。<a href="https://www.openslr.org/12">配布元</a>、<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。録音IDは各欄に記載。先頭最大6秒の抜粋です。</p><p>原音とHNMは既存許諾確認済み掲載WAVをそのまま再利用。新PMLは16kHz解析・seed 0再合成、FLOAT32 WAVへ変換。音量正規化・クリップなし。過去の掲載WAVはPCM16変換です。著者が今回の改変を推奨しているという意味ではありません。</p></main></html>
