name: 前回の実測HTMLを復元
on:
  push:
    branches: [feat/six-references-with-report]
    paths: ['.github/workflows/restore-reference-report.yml']
permissions:
  contents: write
  actions: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.23'
          enable-cache: true
      - name: 固定した実測成果物を取得・照合する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runs/reference-restored
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/Hiroshiba/check-nonml-saikyo-vocoder/actions/artifacts/11743843750/zip' \
            -o "$RUNNER_TEMP/reference.zip"
          echo "26331062196fb72cbc60010ed0f6ebd52994e1476ad496be11d477f975c4cb68  $RUNNER_TEMP/reference.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/reference.zip" -d runs/reference-restored
          uv sync --locked
      - name: 実波形・音声例を照合し、測定値を変えず保存する
        run: |
          uv run --locked python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from vocoderbench.references.catalog import DEFAULT_METHODS
          from vocoderbench.references.common import read
          from vocoderbench.references.publish import publish
          roots = list(Path('runs/reference-restored').rglob('comparison/results.json'))
          if len(roots) != 1:
              raise ValueError(f'比較結果が一意でありません: {roots}')
          source = roots[0].parent
          data = read(source / 'results.json')
          assert data['selected_methods'] == list(DEFAULT_METHODS)
          assert data['planned_cases'] == 2 and len(data['resynthesis']) == 14
          assert data['failure_count'] == 0
          assert data['contract']['scope'] == 'smoke'
          assert data['formal_base']['method'] is None
          for row in data['resynthesis']:
              assert row['status'] == 'measured'
              assert row['mos']['value'] is None
              path = source / 'native' / row['method'] / (row['case'] + '.npy')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['output_sha256']
              y = np.load(path, allow_pickle=False)
              assert y.ndim == 1 and len(y) == row['output_samples']
              assert np.isfinite(y).all() and np.max(np.abs(y)) > 1e-10
          audio = read(source / 'audio_samples.json')['samples']
          assert len(audio) == 16
          for sample in audio:
              assert sample['data_uri'].startswith('data:audio/wav;base64,')
              raw = base64.b64decode(sample['data_uri'].split(',', 1)[1], validate=True)
              y, sr = sf.read(io.BytesIO(raw))
              assert len(y) == sample['n_samples']
              assert sr == sample['sample_rate'] and y.ndim == 1
          provenance = {
              'source_pr': 26, 'workflow_run_id': 38243678340,
              'workflow_url': 'https://github.com/Hiroshiba/check-nonml-saikyo-vocoder/actions/runs/38243678340',
              'source_head_sha': '3d69b1f6e6fe19554083b7fb4ae72f30636a2b63',
              'artifact_id': 11743843750,
              'artifact_zip_sha256': '26331062196fb72cbc60010ed0f6ebd52994e1476ad496be11d477f975c4cb68',
              'verified_native_waveforms': 14, 'verified_audio_examples': 16,
              'new_inference_performed': False,
          }
          target = publish(source, 'reference-methods', 'WORLD＋6方式：解析・再合成と音声出力の確認', provenance)
          assert target == Path.cwd() / 'experiments/2026-10-12/reference-methods/results/run-001'
          print('PUBLISHED', target)
          print(json.dumps(read(target / 'summary.json'), ensure_ascii=False, indent=2))
          PY
      - name: サイト一覧とリンクを検査する
        run: |
          uv run --locked ruff check .
          uv run --locked python scripts/build_site.py
          test -f _site/experiments/2026-10-12/reference-methods/results/run-001/index.html
          grep -q 'reference-methods/results/run-001/index.html' _site/index.html
      - name: このPRのブランチだけへ保存する
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/2026-10-12/reference-methods
          git commit -m 'docs: 14再合成の実測HTML・JSON・音声を永続保存'
          git push origin HEAD:feat/six-references-with-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-report-validation
          path: |
            experiments/2026-10-12/reference-methods
            runs/logs
          retention-days: 14
