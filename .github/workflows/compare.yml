name: 静的解析
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --locked --only-dev
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ruff
            .cache/source-size.json
          key: static-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: static-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: キャッシュを使って静的解析する
        shell: bash
        run: |
          mkdir -p runs/logs
          uv run --locked --only-dev ruff check . 2>&1 | tee runs/logs/ruff.log
          uv run --locked --only-dev python scripts/check_source_size.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-logs
          path: runs/logs
