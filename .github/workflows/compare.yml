name: Verify comparison workbench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m vocoderbench.build_world
      - run: python -m vocoderbench.build_llsm
      - run: python -m unittest discover -s tests -v
      - run: python -m vocoderbench.run --no-natural --sample-rates 16000 --output runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report
          path: runs/ci
