name: 既存方式の比較確認
on:
  pull_request:
    paths:
      - 'vocoderbench/references/**'
      - 'vocoderbench/reference.py'
      - 'scripts/setup_references.sh'
      - '.github/workflows/references.yml'
  push:
    branches: [main]
    paths:
      - 'vocoderbench/references/**'
      - 'vocoderbench/reference.py'
      - 'scripts/setup_references.sh'
      - '.github/workflows/references.yml'
  workflow_dispatch:
    inputs:
      include_dac:
        description: 'DACも取得・計測する'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: references-${{ github.ref }}
  cancel-in-progress: true
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.23'
          enable-cache: true
      - name: 実行ソースを記録
        run: |
          mkdir -p runs/references-ci
          git archive HEAD | gzip > runs/references-ci/repository.tar.gz
          git rev-parse HEAD > runs/references-ci/commit.txt
      - name: 依存環境を用意する
        if: ${{ hashFiles('scripts/setup_references.sh') != '' }}
        run: |
          uv sync --locked
          sudo apt-get update -qq
          sudo apt-get install -y -qq sptk
          extra=()
          if [ '${{ inputs.include_dac }}' = 'true' ]; then extra+=(--include-dac); fi
          bash scripts/setup_references.sh "${extra[@]}"
      - name: 標準方式で実際に再合成する
        if: ${{ hashFiles('vocoderbench/reference.py') != '' }}
        run: |
          extra=()
          if [ '${{ inputs.include_dac }}' = 'true' ]; then extra+=(--include-dac); fi
          uv run --locked python -m vocoderbench.reference --smoke --output runs/references-ci/comparison "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-validation
          path: runs/references-ci
          retention-days: 14
