<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-labelledby="t d"><title id="t">評価可能な窓の絶対音高差</title><desc id="d">−3半音と＋3半音の中央値と95パーセンタイル。横棒は1 cent当たり20 px。</desc><rect width="680" height="230" fill="#fff"/><text x="20" y="28" fill="#111" font-size="18">絶対差（cent、評価可能窓）</text><text x="20" y="75" fill="#111">−3半音</text><rect x="125" y="57" width="52" height="20" fill="#3567a8"/><text x="185" y="72" fill="#111">中央値 2.588</text><rect x="125" y="87" width="244" height="20" fill="#d0802c"/><text x="380" y="102" fill="#111">95%点 12.225</text><text x="20" y="148" fill="#111">＋3半音</text><rect x="125" y="130" width="55" height="20" fill="#3567a8"/><text x="188" y="145" fill="#111">中央値 2.771</text><rect x="125" y="160" width="286" height="20" fill="#d0802c"/><text x="422" y="175" fill="#111">95%点 14.283</text><text x="20" y="218" fill="#111">青：中央値　橙：95%点。両条件は同じ縮尺。最大値は表を参照。</text></svg>
