<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">HMCZTとHMPPの録音対応平均差</title>
<desc id="desc">指標ごとに別尺度。中央がゼロ、右が正、左が負。総合順位を示さない。</desc>
<style>text{font:17px system-ui,sans-serif;fill:#222} .small{font-size:14px} .axis{stroke:#777;stroke-width:2} .pos{fill:#087e75} .neg{fill:#8545a0}@media(prefers-color-scheme:dark){text{fill:#eee}.axis{stroke:#aaa}}</style>
<text x="24" y="32">HMCZT − HMPP：録音120件の対応平均差</text>
<text class="small" x="24" y="55">各指標内で目盛りを別に設定。右が正、左が負。品質の総合順位ではありません。</text>
<text x="24" y="88">UTMOSv2（予測音質）</text>
<text class="small" x="30" y="132">+0半音・24 kHz 全長</text>
<line class="axis" x1="455" y1="115" x2="455" y2="138"/>
<rect class="pos" x="455" y="118" width="146" height="16"/>
<text class="small" x="680" y="132">0.088233（120/120）</text>
<text class="small" x="30" y="165">-3半音・24 kHz 全長</text>
<line class="axis" x1="455" y1="148" x2="455" y2="171"/>
<rect class="pos" x="455" y="151" width="137" height="16"/>
<text class="small" x="680" y="165">0.082817（120/120）</text>
<text class="small" x="30" y="198">+3半音・24 kHz 全長</text>
<line class="axis" x1="455" y1="181" x2="455" y2="204"/>
<rect class="pos" x="455" y="184" width="190" height="16"/>
<text class="small" x="680" y="198">0.114538（120/120）</text>
<text x="24" y="228">ECAPA（話者類似度）</text>
<text class="small" x="30" y="272">+0半音・16 kHz 全長・無編集</text>
<line class="axis" x1="455" y1="255" x2="455" y2="278"/>
<rect class="neg" x="406" y="258" width="49" height="16"/>
<text class="small" x="680" y="272">-0.001171（120/120）</text>
<text class="small" x="30" y="305">-3半音・16 kHz 全長・編集</text>
<line class="axis" x1="455" y1="288" x2="455" y2="311"/>
<rect class="pos" x="455" y="291" width="190" height="16"/>
<text class="small" x="680" y="305">0.004569（120/120）</text>
<text class="small" x="30" y="338">+3半音・16 kHz 全長・編集</text>
<line class="axis" x1="455" y1="321" x2="455" y2="344"/>
<rect class="pos" x="455" y="324" width="49" height="16"/>
<text class="small" x="680" y="338">0.001178（120/120）</text>
<text class="small" x="30" y="371">+0半音・16 kHz 固定先頭区間</text>
<line class="axis" x1="455" y1="354" x2="455" y2="377"/>
<rect class="neg" x="407" y="357" width="48" height="16"/>
<text class="small" x="680" y="371">-0.001144（120/120）</text>
<text x="24" y="401">SCOREQ（参照との距離）</text>
<text class="small" x="30" y="445">+0半音・16 kHz 固定先頭区間</text>
<line class="axis" x1="455" y1="428" x2="455" y2="451"/>
<rect class="neg" x="265" y="431" width="190" height="16"/>
<text class="small" x="680" y="445">-0.003855（120/120）</text>
<text x="24" y="475">eSTOI（明瞭性）</text>
<text class="small" x="30" y="519">+0半音・16 kHz 固定先頭区間</text>
<line class="axis" x1="455" y1="502" x2="455" y2="525"/>
<rect class="pos" x="455" y="505" width="190" height="16"/>
<text class="small" x="680" y="519">0.000569（120/120）</text>
</svg>
