<svg xmlns="http://www.w3.org/2000/svg" width="690" height="250" viewBox="0 0 690 250" role="img" aria-labelledby="t d"><title id="t">固定F0の微小入力変化とVTMAGNの差</title><desc id="d">ε0.01の録音別95パーセンタイル中央値。主帯域はHMCZTが大きく、全1025点ではHMPPが大きい。</desc><rect width="690" height="250" fill="#fff"/><text x="20" y="28" fill="#111" font-size="18">ε=0.01：録音別95%点の中央値（dB）</text><text x="20" y="72" fill="#111">100–8000 Hz</text><rect x="160" y="51" width="88" height="19" fill="#3567a8"/><rect x="160" y="78" width="102" height="19" fill="#d0802c"/><text x="280" y="67" fill="#111">HMPP 8.772 / HMCZT 10.159</text><text x="20" y="153" fill="#111">全1025点</text><rect x="160" y="132" width="523" height="19" fill="#3567a8"/><rect x="160" y="159" width="456" height="19" fill="#d0802c"/><text x="170" y="218" fill="#111">HMPP 52.306 / HMCZT 45.610</text><text x="20" y="240" fill="#111">青：HMPP　橙：HMCZT。帯域ごとに同じ縮尺。</text></svg>
