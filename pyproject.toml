[project]
name = "nonml-vocoder-workbench"
version = "0.1.0"
description = "非MLボコーダーの比較と測定"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[dependency-groups]
dev = ["ruff==0.17.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
cache-dir = ".cache/ruff"
extend-exclude = [".venv", "_site", "research", "experiments", "runs", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
