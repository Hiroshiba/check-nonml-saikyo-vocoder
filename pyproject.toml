[project]
name = "nonml-vocoder-workbench"
version = "0.1.0"
description = "非MLボコーダーの比較と測定"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyreaper==0.0.11", "pyworld==0.3.5", "setuptools==80.9.0",
  "numpy==2.3.5", "scipy==1.17.0", "pystoi==0.4.1",
  "utmosv2", "torch==2.8.0", "torchaudio==2.8.0", "torchvision==0.23.0",
  "transformers==4.51.3", "librosa==0.11.0", "timm==1.0.15",
]

[dependency-groups]
dev = ["ruff==0.17.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
cache-dir = ".cache/ruff"
extend-exclude = [".venv", "_site", "research", "experiments", "runs", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
utmosv2 = { git = "https://github.com/sarulab-speech/UTMOSv2.git", rev = "cc2700db57bb83ee13dc31ebe1b868c254e15d09" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
